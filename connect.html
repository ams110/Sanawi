<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>سنوي — الربط مع كلود</title>
<!--
  صفحة الدخول لدورة OAuth.

  لماذا هنا لا في الدالّة؟ لأن Supabase يحوّل أي `text/html` تردّه دالّة إلى
  `text/plain` عمداً — قيدُ منصّة لا عطلٌ يُصلَح. جُرّب فظهرت الصفحة نصّاً خاماً
  بحروفٍ محروقة.

  والنقل مكسبٌ لا تنازل:
  · المستخدم يسجّل دخوله على نطاق التطبيق الذي يعرفه، لا على رابط supabase.co.
  · كلمة السرّ تذهب من المتصفّح إلى Supabase مباشرةً — لا تمرّ بخادمنا أصلاً،
    فلا يملك ما يخزّنه حتى لو أراد. الدالّة لا ترى إلا الجلسة الناتجة.

  صفحة مستقلّة بلا React ولا موجّه: نقطة دخول ثانية في Vite، فتأخذ عنوان
  المشروع ومفتاحه العام عند البناء ولا تقرأهما من الرابط — صفحةٌ تأخذ عنوان
  خادم المصادقة من سطر العنوان هي صفحةُ تصيّدٍ جاهزة على نطاقنا.
-->
<style>
  :root { color-scheme: light dark; --bg:#f7f7f5; --surface:#fff; --text:#1a1a18;
          --muted:#6b6b66; --border:#e3e3de; --brand:#2f7d5d; --danger:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14140f; --surface:#1e1e19; --text:#f2f2ee;
            --muted:#a3a39c; --border:#33332c; --brand:#5fbf92; --danger:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--text); direction:rtl;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
          border-radius:20px; padding:28px 24px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; line-height:1.6; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:11px 13px; font-size:16px; border-radius:12px;
          border:1px solid var(--border); background:var(--bg); color:var(--text);
          direction:ltr; text-align:left; }
  input:focus { outline:none; border-color:var(--brand); }
  button { width:100%; margin-top:22px; padding:13px; font-size:16px; font-weight:700;
           border:0; border-radius:12px; background:var(--brand); color:#fff; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .msg { margin:14px 0 0; padding:11px 13px; border-radius:12px; font-size:14px;
         background:color-mix(in srgb, var(--danger) 12%, transparent); color:var(--danger); }
  .msg[hidden] { display:none; }
  .note { margin:20px 0 0; font-size:12.5px; color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>سنوي</h1>
    <p class="sub" id="sub">سجّل دخولك ليقرأ كلود التزاماتك ويسجّل إيداعاتك. نفس بريد التطبيق وكلمة سرّه.</p>

    <p class="msg" id="msg" hidden></p>

    <label for="email">البريد</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>

    <label for="password">كلمة السر</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" id="submit">دخول والسماح لكلود</button>

    <p class="note">
      كلمة سرّك تذهب من هذا المتصفّح إلى Supabase مباشرةً — لا تمرّ بخادم سنوي
      ولا يراها كلود ولا تُخزَّن. وكلود يرى ما تراه أنت فقط: سياسات قاعدة
      البيانات نفسها التي تحرس التطبيق.
    </p>
  </form>

<script type="module">
  const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL
  const ANON_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY
  const MCP_URL = `${SUPABASE_URL}/functions/v1/sanawi-mcp`

  const form = document.getElementById('form')
  const msg = document.getElementById('msg')
  const submit = document.getElementById('submit')

  const show = (text) => {
    msg.textContent = text
    msg.hidden = false
  }

  /* وسائط الدورة تصل من الدالّة بعد أن تحقّقت من العميل ورابط عودته. نمرّرها
     كما هي؛ الدالّة تتحقّق منها ثانيةً قبل إصدار الرمز فلا يكفي تعديلها هنا. */
  const params = new URLSearchParams(location.search)
  const required = ['client_id', 'redirect_uri', 'code_challenge']

  if (required.some((key) => !params.get(key))) {
    form.querySelectorAll('label, input, button, .note').forEach((el) => el.remove())
    document.getElementById('sub').textContent =
      'هذه الصفحة تُفتح من كلود عند ربط سنوي، لا مباشرةً. أضف الخادم في كلود ← Settings ← Connectors.'
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault()
    msg.hidden = true
    submit.disabled = true
    submit.textContent = 'لحظة…'

    try {
      // كلمة السرّ تذهب إلى Supabase مباشرةً — خادمنا ليس في هذا المسار أصلاً.
      const auth = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', apikey: ANON_KEY },
        body: JSON.stringify({
          email: form.email.value.trim(),
          password: form.password.value,
        }),
      })
      const session = await auth.json()

      if (!auth.ok || !session.access_token) {
        show('البريد أو كلمة السر غير صحيحة.')
        return
      }

      // الجلسة وحدها تصل الدالّة، فتتحقّق منها وتصدر رمزاً مربوطاً بـ PKCE.
      const issued = await fetch(`${MCP_URL}/authorize`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          access_token: session.access_token,
          refresh_token: session.refresh_token,
          client_id: params.get('client_id'),
          redirect_uri: params.get('redirect_uri'),
          code_challenge: params.get('code_challenge'),
          state: params.get('state') ?? '',
          resource: params.get('resource') ?? '',
        }),
      })
      const result = await issued.json()

      if (!issued.ok || !result.redirect) {
        show(result.error_description ?? 'تعذّر إتمام الربط. أعد المحاولة من كلود.')
        return
      }

      location.href = result.redirect
    } catch {
      show('تعذّر الاتصال. تأكّد من الإنترنت وأعد المحاولة.')
    } finally {
      submit.disabled = false
      submit.textContent = 'دخول والسماح لكلود'
    }
  })
</script>
</body>
</html>
