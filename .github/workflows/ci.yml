name: الفحص

# البوّابة. لا يمرّ إلى main ولا إلى النشر ما لم تُفتح.
#
# كانت مفقودة تماماً: `npm run build` وحده كان يسبق نشر الواجهة، فيفحص الأنواع
# ولا يشغّل اختباراً واحداً. مئةٌ وستّة وستّون اختباراً وفحصُ الخادم كلها كانت
# تعيش على أن يتذكّرها من يدفع — ونشرُ الواجهة تلقائيٌّ، فما ينكسر يصل الموقع
# في دقيقة بلا أن يوقفه شيء.
#
# ترتيب الخطوات مقصود: الأسرع أولاً. lint يسقط في ثوانٍ، وفحص الخادم يرفع
# قاعدةً مزيّفة ويمرّ على إحدى وعشرين أداة — فلا معنى لانتظاره ليقال إن هناك
# فاصلةً منقوطة زائدة.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: قواعد الأسلوب
        run: npm run lint

      # الملف الموحَّد وعدٌ في README: «الصقه واضغط Run». كان يُحدَّث باليد
      # فتوقّف عند 0013 بينما الهجرات وصلت 0015 — ونقصٌ كهذا لا يظهر عند
      # اللصق بل بعد أسابيع في شاشةٍ لا علاقة لها به.
      - name: السكيما الموحَّدة محدَّثة
        run: npm run check:schema

      - name: الأنواع وبناء الواجهة
        run: npm run build
        env:
          # قيم وهمية: البناء يحقنها في الحزمة ولا ينادي بها شيئاً. النشر
          # وحده يستعمل الحقيقية، فلا يحتاج الفحص أسراراً — وهكذا يعمل على
          # PR من نسخة مستنسخة حيث الأسرار غير متاحة أصلاً.
          VITE_SUPABASE_URL: https://check.supabase.co
          VITE_SUPABASE_ANON_KEY: check-anon-key

      # ‏`version.json` هو ما يعرف به التطبيق المفتوح أن نسخةً أحدث نُشرت.
      # اختفاؤه لا يكسر بناءً ولا يُسقط فحصاً — يُسكِت التحديث وحده، فيبقى
      # الناس على نسخةٍ قديمة بلا أن يقول لهم شيء. فيُتحقّق منه صراحةً.
      - name: بصمة البناء منشورة
        run: |
          test -s dist/version.json || {
            echo "::error::dist/version.json مفقود — التطبيق لن يعرف أن نسخةً جديدة نُشرت"
            exit 1
          }
          cat dist/version.json

      - name: اختبارات محرّك الحساب
        run: npx vitest run

      # يرفع Supabase مزيّفاً في الذاكرة ويمرّ على الأدوات كلها قراءةً وكتابةً،
      # ويمشي بدورة OAuth كاملة. بلا حساب ولا شبكة، فيعمل هنا كما يعمل محلياً.
      - name: خادم MCP
        run: |
          npm run build:mcp
          npm run check:mcp

      # التوليد يفحص كل مسار نسبي في المخرَج: مسارٌ مكسور في Deno لا يظهر عند
      # النشر بل عند أول نداء من كلود، خطأَ تشغيلٍ في دالّةٍ بعيدة لا يراها أحد.
      - name: دالّة Supabase تُبنى
        run: npm run build:edge
