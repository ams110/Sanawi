name: نشر خادم MCP

# التشغيل يدويّ من صفحة Actions — تكفي ضغطة من المتصفّح على التلفون، فلا
# يحتاج نشرُ الخادم كمبيوتراً ولا Supabase CLI على جهاز.
#
# ولا يعمل على كل دفعة عن قصد: النشر يبدّل خادماً حيّاً مربوطاً بكلود، وتبديله
# من تلقائه مع كل تعديل في الواجهة ليس ما يريده أحد.
on:
  workflow_dispatch:
    inputs:
      read_only:
        description: 'وضع القراءة فقط (أدوات الكتابة لا تُسجَّل أصلاً)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # سرٌّ ناقص لا يفشل هنا من تلقائه: `supabase secrets set` يقبل قيمةً
      # فارغة بصمت، فتُنشر دالّة ترفض الإقلاع، ويقرأ صاحبها «تعذّر الاتصال»
      # في كلود بلا سبب. الفحص هنا يسمّي السرّ الناقص بالاسم.
      - name: التحقّق من الأسرار
        env:
          TOKEN: ${{ secrets.SANAWI_TOKEN_SECRET }}
          SECRETS: |
            SUPABASE_ACCESS_TOKEN=${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
            SUPABASE_PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF != '' }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL != '' }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}
            SANAWI_TOKEN_SECRET=${{ secrets.SANAWI_TOKEN_SECRET != '' }}
        run: |
          missing=""
          while IFS='=' read -r name present; do
            [ -z "$name" ] && continue
            [ "$present" = "true" ] || missing="$missing $name"
          done <<< "$SECRETS"

          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing"
            echo "أضِفها في Settings ← Secrets and variables ← Actions." >> $GITHUB_STEP_SUMMARY
            echo "الناقص:$missing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # بهذا السرّ تُشفَّر رموز كل المستخدمين، فقِصَره يكسر الجميع دفعةً واحدة.
          if [ ${#TOKEN} -lt 32 ]; then
            echo "::error::SANAWI_TOKEN_SECRET أقصر من 32 حرفاً — به تُشفَّر رموز كل المستخدمين."
            exit 1
          fi

          echo "الأسرار الخمسة موجودة." >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تنصيب الحزم
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # الفحص قبل النشر لا بعده: الدالّة البعيدة لا يراها صاحبها حين تنكسر،
      # فالعطل يجب أن يظهر هنا لا في أول سؤال يسأله كلود.
      - name: فحص الخادم
        run: |
          npm run build:mcp
          npm run check:mcp

      - name: تجهيز دالّة Supabase
        run: npm run build:edge

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # الـ CLI يقرأ إعداد المشروع من هنا. يُكتب في التدفّق لا في المستودع:
      # معرّف المشروع سرّ، ولا يدخل ملفاً يُقرأ من الجميع.
      - name: إعداد المشروع
        run: |
          cat > supabase/config.toml <<'TOML'
          project_id = "sanawi"

          [functions.sanawi-mcp]
          verify_jwt = false
          TOML

      # الأسرار تُضبط من هنا لا من لوحة Supabase: كتابةُ كلمة سرّ في متصفّح
      # تلفون أسهل خطأً، والقيمة الواحدة يجب أن تعيش في مكان واحد.
      #
      # و SANAWI_PUBLIC_URL يُبنى هنا لأن التدفّق يعرف العنوان يقيناً: وكيل
      # Supabase يقصّ `/functions/v1` قبل أن يصل الدالّة، فلو تركناها تستنتجه
      # أعلنت روابط ناقصة ووجد كلود 404 عند أول خطوة.
      - name: ضبط أسرار الدالّة
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            SANAWI_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            SANAWI_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            SANAWI_TOKEN_SECRET="${{ secrets.SANAWI_TOKEN_SECRET }}" \
            SANAWI_PUBLIC_URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/sanawi-mcp" \
            SANAWI_READ_ONLY="${{ inputs.read_only && '1' || '0' }}"

      # ‏--no-verify-jwt ضروري: كلود ليس مستخدماً في Supabase ولا يحمل JWT منها،
      # فبوّابتها لا تصلح حارساً. الحارس هو OAuth داخل الدالّة: نداءٌ بلا رمزٍ
      # صالح يُردّ 401 مع عنوان خادم التفويض، فيفتح كلود صفحة الدخول.
      - name: نشر الدالّة
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sanawi-mcp \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: الرابط
        run: |
          echo "### خادم MCP منشور" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'الرابط — واحدٌ لكل المستخدمين، ولا سرّ فيه:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/sanawi-mcp" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'في كلود: Settings ← Connectors ← Add custom connector، والصق العنوان.' >> $GITHUB_STEP_SUMMARY
          echo 'سيفتح كلود صفحة دخول سنوي — كل مستخدم يدخل بحسابه ويرى بياناته وحده.' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "الوضع: ${{ inputs.read_only && 'قراءة فقط' || 'قراءة وكتابة' }}" >> $GITHUB_STEP_SUMMARY
