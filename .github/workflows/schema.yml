name: بوّابة السكيما

# السكيما تسبق الكود، وإلا نشرنا شيفرةً تسأل عن أعمدة لا وجود لها.
#
# هذه الفجوة كانت مفتوحة تماماً: `deploy.yml` ينشر الواجهة وخادم MCP على كل
# دمج، ولا شيء يطبّق الهجرات ولا يسأل عنها. فمن يدمج هجرةً وينسى تطبيقها يجد
# تطبيقاً منشوراً يستعلم عن `starts_on` وقاعدةً لا تعرفها — عطلٌ في الإنتاج
# لا يوقفه شيء، ولا يظهر في أي فحص. وقع ذلك فعلاً مع الهجرة 0015.
#
# **لماذا بوّابة لا تطبيقٌ تلقائي؟** `supabase db push` يحتاج كلمة سرّ
# القاعدة — سرٌّ لا يملكه المستودع اليوم — ويكتب على قاعدة الإنتاج بلا عينٍ
# بشرية. والبوّابة تحقّق الغرض نفسه بالمفتاح العام وحده: تقرأ ولا تكتب،
# وتوقف النشر إذا تخلّفت السكيما عن الشيفرة. الإصلاح يبقى قراراً واعياً:
# طبّق الهجرة، ثم أعِد التشغيل.
#
# والفحص قراءةٌ محضة بالمفتاح العام، فلا يرى صفّ أحد: RLS تحرسه كما تحرس
# أيّ متصفّح. ما يفحصه وجودُ الجداول والأعمدة لا محتواها.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  gate:
    name: الهجرات مطبَّقة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: الجداول والأعمدة موجودة على الإنتاج
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run check:db

      - name: ماذا تفعل إن فشل
        if: failure()
        run: |
          {
            echo '### السكيما متخلّفة عن الشيفرة'
            echo ''
            echo 'الشيفرة المدموجة تحتاج جدولاً أو عموداً غير موجود على قاعدة الإنتاج،'
            echo 'والنشر أُوقف قبل أن يصل المستخدم تطبيقٌ يستعلم عمّا لا وجود له.'
            echo ''
            echo 'الإصلاح — طبّق الهجرات ثم أعِد تشغيل هذا التدفّق:'
            echo ''
            echo '1. Supabase → SQL Editor'
            echo '2. الصق `supabase/all-in-one.sql` كاملاً واضغط Run — آمن للتكرار.'
            echo '3. Actions → أعِد تشغيل التدفّق الفاشل.'
          } >> $GITHUB_STEP_SUMMARY
