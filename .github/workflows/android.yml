name: بناء APK

# التشغيل اليدوي هو الافتراض: البناء يستغرق دقائق ويستهلك حصة الإجراءات،
# ولا معنى لتشغيله على كل دفعة بينما التطبيق يحمّل واجهته من الموقع.
#
# لكنّ «لا معنى» هذا صار خطأً مرّة، وبثمنٍ باهظ: بُني APK واحد يوم ٣ آب
# الساعة ٣:٣١، وأُضيف `server.url` — الذي يجعل التطبيق يحمّل من الموقع —
# الساعة ٤:٢٩ من اليوم نفسه. فبقي على الهاتف تطبيقٌ يحمل نسخةً محزومة من
# تلك الساعة، لا يقرأ الموقع أصلاً، ولا يصله شيءٌ ممّا نُشر بعده. ثلاثة أيام
# من الميزات وصلت الموقع ولم تصل صاحبه، وكل دمجٍ كان يبدو بلا أثر.
#
# فما يمسّ القشرة — إعداد Capacitor، أو مشروع أندرويد، أو هذا الملف — يبني
# APK جديداً من تلقائه. وما يمسّ الواجهة وحدها يبقى بلا بناء: هذا هو الغرض
# من `server.url` أصلاً.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/android.yml'

# الإصدار يحتاج كتابةً على المستودع؛ وبدونه لا يبقى للـ APK إلا أرشيفُ
# تشغيلٍ لا يُنزَّل من الهاتف بلا تسجيل دخول وفكِّ ضغط.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تنصيب الحزم
        run: npm ci
        env:
          # المتصفحات غير مطلوبة للبناء، وتنزيلها يضيف دقائق بلا فائدة.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: بناء الويب
        run: npm run build
        env:
          # المفاتيح تأتي من أسرار المستودع: المفتاح العام يُحزم داخل الـ APK
          # ولا ضرر في ذلك، لكن إبقاءه خارج الشيفرة يجعل تبديل المشروع تعديلَ
          # إعداد لا تعديلَ كود.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: مزامنة أندرويد
        run: npx cap sync android

      - name: بناء APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: تسمية باسمٍ يقول نسخته
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/sanawi-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sanawi-apk
          path: out/*.apk
          retention-days: 30

      # ‏رابطٌ مباشر يُفتح من الهاتف: أرشيف التشغيل يحتاج حساباً وفكَّ ضغط،
      # وهذا ما يجعل «نزّل التطبيق» مهمّةً تُؤجَّل.
      - name: إصدارٌ يُنزَّل من الهاتف
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          notes=$(cat <<'EOF'
          قشرةٌ تفتح sanawi.kabblan.com، فكل ما بعدها من الواجهة يصل بإعادة تحميل بلا تنصيب.

          التنصيب فوق نسخةٍ قديمة قد يرفضه أندرويد لاختلاف التوقيع — أزِل القديم أولاً.
          ولا شيء يضيع بذلك: بياناتك كلها في الخادم لا في الجهاز.
          EOF
          )
          gh release create "apk-$short" "out/sanawi-$short.apk" \
            --title "سنوي — APK $short" --notes "$notes" \
            || echo "إصدارٌ بهذه البصمة موجود — لا شيء يُفعل"
